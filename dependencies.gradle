dependencies {

    api("com.github.GTNewHorizons:Baubles-Expanded:2.2.2-GTNH:dev")

    implementation("thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev")

    compileOnly('com.github.GTNewHorizons:ThaumicBases:1.9.5:dev') {transitive=false}
    compileOnly('com.github.GTNewHorizons:Thaumic_Exploration:1.5.5-GTNH:dev') {transitive=false}
    compileOnly('com.github.GTNewHorizons:NewHorizonsCoreMod:2.8.51:dev')
    compileOnly('com.github.GTNewHorizons:WitchingGadgets:1.8.8-GTNH:dev')

    runtimeOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.8.37-GTNH:dev")

    //For Testing:
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:ThaumicBases:1.9.5:dev")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Thaumic_Exploration:1.5.5-GTNH:dev")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:WitchingGadgets:1.8.8-GTNH:dev")

    //GTNH
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:NewHorizonsCoreMod:2.8.51:dev")
    runtimeOnlyNonPublishable rfg.deobf("curse.maven:biomes-o-plenty-220318:2499612")
    runtimeOnlyNonPublishable rfg.deobf("curse.maven:witchery-69673:2234410")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:WitcheryExtras:1.4.0:dev") { transitive = false }
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:WailaHarvestability:1.3.4-GTNH:dev")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Galacticraft:3.4.7-GTNH:dev")

    // deps may transitively add Baubles, so we replace it
    project.getConfigurations()
        .all(c -> {
            final DependencySubstitutions ds = c.getResolutionStrategy()
                .getDependencySubstitution();
            ds.substitute(ds.module("com.github.GTNewHorizons:Baubles"))
                .using(ds.module("com.github.GTNewHorizons:Baubles-Expanded:2.2.2-GTNH"))
                .withClassifier("dev")
                .because("Baubles-Expanded replaces Baubles");
        });
}
